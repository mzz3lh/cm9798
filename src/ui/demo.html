<meta charset="utf-8">
<title>CM 97/98 Match Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* One 640x480 screen, scaled up to fit with square pixels, like DOSBox. */
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #000; }
body { display: grid; place-items: center; }
#screen {
  display: block;
  width: min(100vw, calc(100vh * 4 / 3));
  height: auto;
  aspect-ratio: 4 / 3;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
}
</style>
<canvas id="screen" width="640" height="480" aria-label="Championship Manager 97/98 match demo"></canvas>
